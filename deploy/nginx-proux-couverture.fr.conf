# /etc/nginx/sites-available/proux-couverture.fr
#
# Reverse-proxy vers le process Next.js (PM2 « proux », port 3100).
#
# Next.js gère les Server Actions, l'optimisation d'images et les en-têtes de
# sécurité (next.config.ts). Nginx :
#   - proxifie les pages,
#   - sert /_next/static et /video EN DIRECT depuis le disque (immuables),
#   - met en cache disque les images optimisées /_next/image — ce cache SURVIT
#     aux `pnpm build` (qui vident .next/cache) et aux reload PM2, tant que
#     l'URL de l'image ne change pas. C'est ce qui évite les 2–3 s par image
#     au premier chargement après un déploiement.
#
# Domaine canonique : www.proux-couverture.fr  (= content/company.ts siteUrl).
# L'apex proux-couverture.fr redirige en 301 vers www.
#
# Pose du fichier :
#   cp deploy/nginx-proux-couverture.fr.conf /etc/nginx/sites-available/proux-couverture.fr
#   mkdir -p /var/cache/nginx/proux-img && chown -R www-data:www-data /var/cache/nginx/proux-img
#   ln -s /etc/nginx/sites-available/proux-couverture.fr /etc/nginx/sites-enabled/   # (si pas déjà fait)
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d proux-couverture.fr -d www.proux-couverture.fr   # (si pas déjà fait)
#
# Certbot ajoute les blocs SSL (443) et la redirection HTTP→HTTPS.
# La redirection apex→www ci-dessous est conservée après passage de Certbot.

# ── Cache disque pour les images optimisées par Next ────────────────────────
# 500 Mo max, éviction LRU, on garde une réponse jusqu'à 30 j sans revalider.
# `use_temp_path=off` : écriture directe dans le dossier de cache (plus rapide).
proxy_cache_path /var/cache/nginx/proux-img
    levels=1:2
    keys_zone=proux_img:10m
    max_size=500m
    inactive=30d
    use_temp_path=off;

# ── apex : redirige tout vers www ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name proux-couverture.fr;
    return 301 https://www.proux-couverture.fr$request_uri;
}

# ── www : le site ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.proux-couverture.fr;

    access_log /var/log/nginx/proux-access.log;
    error_log  /var/log/nginx/proux-error.log;

    client_max_body_size 2M;

    # Racine du projet sur le VPS — utilisée par les `alias` ci-dessous.
    set $app_root /var/www/proux-couverture.fr;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml application/manifest+json;

    # ── Images optimisées : proxy + cache disque persistant ────────────────
    # La clé de cache ignore les cookies : /_next/image ne dépend que de l'URL
    # (+ l'en-tête Accept, géré par `Vary: Accept` renvoyé par Next).
    location /_next/image {
        proxy_pass              http://127.0.0.1:3100;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_cache             proux_img;
        proxy_cache_key         "$scheme$request_uri$http_accept";
        proxy_cache_valid       200 30d;
        proxy_cache_use_stale   error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock        on;           # 1 seule régénération concurrente
        proxy_read_timeout      30s;

        add_header X-Img-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Assets JS/CSS immuables (hash dans le nom) : servis depuis le disque ─
    location /_next/static/ {
        alias $app_root/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @next;   # fallback proxy si le fichier n'existe pas
    }

    # ── Vidéo / poster du hero : servis depuis le disque ───────────────────
    location /video/ {
        alias $app_root/public/video/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @next;
    }

    # ── Le reste : proxy vers Next ────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location @next {
        proxy_pass       http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Après « certbot --nginx », vérifier que le bloc apex (proux-couverture.fr)
# redirige bien vers https://www.… (Certbot peut le réécrire en ajoutant un
# listen 443 ssl ; garder la logique « return 301 https://www.… »).
#
# Purge manuelle du cache images (rare — le cache est clé-par-URL, il n'y a
# pas de collision au déploiement) :
#   rm -rf /var/cache/nginx/proux-img/* && systemctl reload nginx
#
# Si un jour on préfère l'apex comme canonique : inverser les server_name,
# changer company.siteUrl en "https://proux-couverture.fr", régénérer
# sitemap.xml / OG image, et rediriger www → apex.
