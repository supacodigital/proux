# /etc/nginx/sites-available/proux-couverture.fr
#
# Reverse-proxy vers le process Next.js (PM2 « proux », port 3100).
# Next.js gère lui-même les en-têtes de sécurité (next.config.ts), le cache
# des assets /_next/static et l'optimisation d'images : Nginx ne fait que
# proxifier et compresser.
#
# Domaine canonique : www.proux-couverture.fr  (= content/company.ts siteUrl).
# L'apex proux-couverture.fr redirige en 301 vers www.
#
# Pose du fichier :
#   cp deploy/nginx-proux-couverture.fr.conf /etc/nginx/sites-available/proux-couverture.fr
#   ln -s /etc/nginx/sites-available/proux-couverture.fr /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d proux-couverture.fr -d www.proux-couverture.fr
#
# Certbot ajoute les blocs SSL (443) et la redirection HTTP→HTTPS.
# La redirection apex→www ci-dessous est conservée après passage de Certbot.

# ── apex : redirige tout vers www ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name proux-couverture.fr;
    return 301 https://www.proux-couverture.fr$request_uri;
}

# ── www : le site ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.proux-couverture.fr;

    access_log /var/log/nginx/proux-access.log;
    error_log  /var/log/nginx/proux-error.log;

    client_max_body_size 2M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml application/manifest+json;

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Assets immuables générés par Next (hash dans le nom) : cache agressif.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Après « certbot --nginx », vérifier que le bloc apex (proux-couverture.fr)
# redirige bien vers https://www.… (Certbot peut le réécrire en ajoutant un
# listen 443 ssl ; garder la logique « return 301 https://www.… »).
#
# Si un jour on préfère l'apex comme canonique : inverser les server_name,
# changer company.siteUrl en "https://proux-couverture.fr", régénérer
# sitemap.xml / OG image, et rediriger www → apex.
